<nav class="flex" aria-label="Breadcrumb">
    <ol role="list" class="flex items-center space-x-2">
        {% if items %}
            {% for item in items %}
                <li>
                    <div class="flex items-center">
                        {% if not forloop.first %}
                            <svg class="h-4 w-4 flex-shrink-0 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
                            </svg>
                        {% endif %}
                        {% if item.url %}
                            <a href="{{ item.url }}" class="{% if forloop.first %}text-gray-600 hover:text-gray-800{% else %}ml-2 text-gray-600 hover:text-gray-800{% endif %} text-sm font-medium">
                                {{ item.title }}
                            </a>
                        {% else %}
                            <span class="{% if forloop.first %}text-gray-800{% else %}ml-2 text-gray-800{% endif %} text-sm font-semibold">
                                {{ item.title }}
                            </span>
                        {% endif %}
                    </div>
                </li>
            {% endfor %}
        {% else %}
            <li>
                <div class="flex items-center">
                    <a href="/" class="text-gray-600 hover:text-gray-800 text-sm font-medium">
                        Inicio
                    </a>
                </div>
            </li>
        {% endif %}
    </ol>
</nav>
